# Cloudflare deployment for the R1 Layout Builder: a static-assets-only Worker
# serving dist/. Nothing runs on the server; the project never leaves the browser.
#
# Deployed by .github/workflows/deploy.yml on every push to main. Manual fallback,
# from web/:
#
#   npm run build && cf-run npx wrangler@4.116.0 deploy
#
# A ROUTE, not a custom domain. stoatworks-labs.com is at Cloudflare's limit of 100
# Workers custom domains per zone (error 100122), so `custom_domain = true` would
# upload a Worker that nothing serves. A route has no such limit but needs a proxied
# DNS record to exist first, which wrangler does not create: `r1-layout` is an AAAA
# 100:: record, proxied, made through the API on 2026-11-05. Delete that record and
# this page goes dark with a green deploy.

name = "r1-layout"
compatibility_date = "2026-07-30"

[assets]
directory = "./dist"

[[routes]]
pattern = "r1-layout.stoatworks-labs.com/*"
zone_name = "stoatworks-labs.com"
